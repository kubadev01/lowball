[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lowball"
version = "0.1.0"
description = "Command-line tool to track the prices of products you wish to buy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
include = ["tracker*"]
